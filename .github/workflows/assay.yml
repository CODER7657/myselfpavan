name: Assay repositories

# Re-grades every repository against the rubric, records where each one stood,
# writes prose for anything newly promoted, and commits the result — which
# redeploys the site. Nobody has to be asked to run it, and nobody edits a card
# to change a rank.
on:
  schedule:
    # 03:20 UTC daily — off the hour, so it is not competing with everyone
    # else's midnight cron for runners.
    - cron: "20 3 * * *"

  # The manual button. Actions → "Assay repositories" → "Run workflow".
  workflow_dispatch:
    inputs:
      reason:
        description: "Why you are running it (recorded in the run log)"
        required: false
        default: "manual refresh"
      force:
        description: "Re-record the standings and rewrite every generated card"
        type: boolean
        required: false
        default: false

  # Also refresh whenever the rubric or the tooling itself changes, so a rule
  # change is reflected immediately rather than at the next midnight.
  push:
    branches: [main]
    paths:
      - "packages/assay/src/**"
      - "tools/collect-evidence.mjs"
      - "tools/collect-sealed.mjs"
      - "tools/record-standings.mjs"
      - "tools/write-cards.mjs"
      - ".github/workflows/assay.yml"

concurrency:
  group: assay
  # A superseded run is worse than no run: it holds a two-hour-old checkout and
  # publishes a snapshot that is already stale. Every run collects the same
  # thing from scratch, so the newest one is always the one worth keeping.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assay:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect evidence
        env:
          # Lifts the anonymous 60/hour limit; the account needs roughly 150
          # calls for a full pass.
          GITHUB_TOKEN: ${{ secrets.ASSAY_TOKEN || secrets.GITHUB_TOKEN }}
        run: node tools/collect-evidence.mjs

      # `collectedAt` changes on every run, so a pass where nothing actually
      # happened still rewrites the file. Putting it back here — before anything
      # reads it — means every later step sees the same evidence the site is
      # already serving, and the site does not redeploy for a clock.
      - name: Discard a timestamp-only change
        run: |
          set -euo pipefail
          strip() {
            node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);delete j.collectedAt;delete j.apiCalls;console.log(JSON.stringify(j))}catch(e){console.log("")}})'
          }

          if git diff --quiet -- apps/web/public/data/evidence.json; then
            echo "Evidence unchanged."
            exit 0
          fi

          before=$(git show HEAD:apps/web/public/data/evidence.json | strip)
          after=$(strip < apps/web/public/data/evidence.json)

          if [ "$before" = "$after" ]; then
            echo "Only the timestamp moved — restoring the committed evidence."
            git checkout -- apps/web/public/data/evidence.json
          else
            echo "Evidence moved."
          fi

      # Private repositories, graded and published as a score only.
      #
      # Reads only the ASSAY_TOKEN secret — never the workflow's own token,
      # which cannot see private repositories and would only produce a 403.
      # With no ASSAY_TOKEN set this does nothing and leaves sealed.json as it
      # was. A private repository is read only if it carries the foundry-ready
      # topic, and nothing but its name, score, tier, commit count, last push
      # and band totals is written. Never blocks the public assay.
      - name: Grade private repositories (sealed)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.ASSAY_TOKEN }}
        run: node --experimental-strip-types tools/collect-sealed.mjs

      # Keeps one previous standing, so a card can show what it gained or lost.
      # Writes nothing when no score moved.
      - name: Record the standings
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            node --experimental-strip-types tools/record-standings.mjs --force
          else
            node --experimental-strip-types tools/record-standings.mjs
          fi

      # Prose for a card the gate promoted and nobody has written by hand.
      #
      # Deliberately allowed to fail. No key, a rate limit, or a model having a
      # bad day must not stop the evidence being published — the vault falls
      # back to the card it can build from evidence alone, which is always
      # correct if a little flat. Turn it on by adding GROQ_API_KEY under
      # Settings → Secrets and variables → Actions.
      - name: Write cards for anything newly promoted
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          GITHUB_TOKEN: ${{ secrets.ASSAY_TOKEN || secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            node --experimental-strip-types tools/write-cards.mjs --force
          else
            node --experimental-strip-types tools/write-cards.mjs
          fi

      # The second line of defence, between collecting and publishing.
      #
      # The collector already retries and carries a failed repository forward,
      # so a bad read rarely gets this far. This catches the one that does: a
      # snapshot where a repository has quietly lost its files scores lower,
      # looks entirely plausible, and withdraws real cards from the vault.
      # Refusing to publish is always cheaper than noticing a week later.
      - name: Verify nothing collapsed
        run: node --experimental-strip-types tools/verify-evidence.mjs

      - name: Commit if anything moved
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git config user.name  "foundry-assay[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain apps/web/public/data)" ]; then
            echo "Nothing to publish."
            exit 0
          fi

          # Publish onto whatever main is *now*, not onto the commit this run
          # was triggered from.
          #
          # actions/checkout pins a run to its triggering commit, and a run can
          # sit queued for hours — one waited from 03:04 until 04:55, by which
          # time two other refreshes had landed and the push was rejected with
          # "fetch first". The collected evidence was fine; only the publish
          # failed, which is the worst way to lose a run.
          #
          # These files are generated output, not authored work: there is
          # nothing to merge, and the newest collection is always the right
          # one. So the snapshot is replayed onto the current tip instead.
          snapshot="$(mktemp -d)"
          cp apps/web/public/data/*.json "$snapshot/"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            # --force is the point: the working copy is deliberately discarded,
            # because the snapshot it held is already safe in $snapshot.
            git checkout --quiet --force -B publish origin/main
            cp "$snapshot"/*.json apps/web/public/data/

            if [ -z "$(git status --porcelain apps/web/public/data)" ]; then
              echo "Another run already published this evidence. Nothing to do."
              exit 0
            fi

            git add apps/web/public/data
            git commit --quiet \
              -m "chore(assay): refresh repository evidence" \
              -m "Ran: ${EVENT}${REASON:+ — ${REASON}}"

            if git push --quiet origin publish:main; then
              echo "Published on attempt ${attempt}."
              exit 0
            fi

            echo "main moved while publishing — replaying onto the new tip (${attempt}/3)."
            git reset --quiet --hard HEAD~1
          done

          echo "::error::Could not publish after three attempts. The evidence was collected; only the push failed."
          exit 1

      # What the run decided, in the run's own summary — so pressing the button
      # tells you the outcome without opening the site.
      #
      # Runs even when publishing failed: the grading is the useful part, and
      # hiding it because a push raced is how a failed run looks like a failed
      # assay.
      - name: Summary
        if: always()
        run: node --experimental-strip-types tools/assay-summary.ts >> "$GITHUB_STEP_SUMMARY"
